<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; base-uri 'none'; form-action 'none'">
<title>Threads 連携の中継ページ</title>
<style>
  body { font-family: -apple-system, BlinkMacSystemFont, sans-serif; max-width: 560px; margin: 48px auto; padding: 0 16px; line-height: 1.7; background: #f6f7f9; color: #222; }
  .box { background: #fff; border-radius: 12px; padding: 24px; box-shadow: 0 1px 4px rgba(0,0,0,.08); }
  h1 { font-size: 20px; margin-top: 0; }
  textarea { width: 100%; box-sizing: border-box; font-size: 13px; }
  button { font-size: 16px; padding: 8px 16px; border-radius: 8px; border: 1px solid #ccc; background: #2563eb; color: #fff; }
  .hint { color: #666; font-size: 14px; }
</style>
</head>
<body>
<div class="box">
  <h1 id="title">このMacのツールに戻っています…</h1>
  <p id="msg">Threads で「許可する」を押したあとに表示される中継ページです。自動で、このMacで動いているツールへ移動します。</p>
  <div id="manual" hidden>
    <p>自動で移動しない場合は、下の「コピー」を押して、ツールの「SNSアカウント連携」画面の「許可したあとのページのURL」に貼り付けてください。</p>
    <textarea id="url" rows="4" readonly></textarea>
    <p><button id="copy" type="button">コピー</button></p>
    <p class="hint">※このURLは、SNSやチャットには貼らないでください（ツールの画面にだけ貼り付けます）。</p>
  </div>
</div>
<script>
// このページの役割は「Threads から受け取った code と state を、このMacのツールにそのまま渡す」ことだけです。
// ・秘密の情報（アプリシークレットやトークン）はこのページには含まれていません
// ・送り先は、このMacの中のツール（127.0.0.1）だけに固定しています（他のサイトには送りません）
// ・code だけではトークンに交換できません（アプリシークレットはツールの中だけにあります）
(function () {
  var TOOL = 'http://127.0.0.1:4567/oauth/threads/callback';
  if (window.top !== window.self) return; // 他のサイトの中に埋め込まれたときは何もしない
  var p = new URLSearchParams(location.search);
  var code = (p.get('code') || '').replace(/#_$/, '');
  var state = p.get('state') || '';
  var error = p.get('error');
  var out = new URLSearchParams();
  var ok = false;

  if (error) {
    out.set('error', error.slice(0, 100));
    var d = p.get('error_description') || p.get('error_reason');
    if (d) out.set('error_description', d.slice(0, 200));
    ok = /^[0-9a-f]{20,100}$/.test(state);
    if (ok) out.set('state', state);
  } else if (/^[A-Za-z0-9_\-.~]{10,2048}$/.test(code) && /^[0-9a-f]{20,100}$/.test(state)) {
    out.set('code', code);
    out.set('state', state);
    ok = true;
  }

  var title = document.getElementById('title');
  var msg = document.getElementById('msg');
  if (!ok) {
    title.textContent = 'Threads 連携の中継ページ';
    msg.textContent = 'このページは、ツールの「SNSアカウント連携」画面から Threads に接続したときだけ使います。直接開いた場合は何もしません。';
    return;
  }

  var target = TOOL + '?' + out.toString();
  document.getElementById('url').value = location.href;
  document.getElementById('copy').onclick = function () {
    var t = document.getElementById('url');
    t.select();
    try { navigator.clipboard.writeText(t.value); } catch (e) { document.execCommand('copy'); }
    this.textContent = 'コピーしました';
  };
  setTimeout(function () {
    document.getElementById('manual').hidden = false;
    title.textContent = '自動で移動しませんでした';
  }, 4000);
  location.replace(target); // 履歴に code の入ったURLを残さない
})();
</script>
</body>
</html>
